<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roket Antariksa</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#050816;--text:#eaf0ff;--gold:#ffd98a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif}
body{background:radial-gradient(ellipse at 20% 10%,#1b1450 0%,#0a0d2c 45%,#03040d 100%)}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#planet{position:fixed;right:-60px;bottom:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ff9d7a,#b3405e 55%,#3a1450);box-shadow:0 0 60px #b3405e66;opacity:.8;pointer-events:none}
.pl{position:fixed;border-radius:50%;pointer-events:none;animation:flt 9s ease-in-out infinite alternate}
@keyframes flt{from{transform:translateY(0)}to{transform:translateY(-12px)}}
#p2{left:-50px;top:18%;width:150px;height:150px;background:radial-gradient(circle at 32% 30%,#9be7ff,#3a79d8 55%,#10265e);box-shadow:0 0 40px #3a79d855;opacity:.85}
#p3{left:14%;bottom:8%;width:70px;height:70px;background:radial-gradient(circle at 30% 30%,#e6d4ff,#8a63d2 60%,#2c1a5e);box-shadow:0 0 25px #8a63d255;opacity:.8;animation-delay:-3s}
#p4{right:12%;top:12%;width:46px;height:46px;background:radial-gradient(circle at 30% 30%,#fff6cf,#d9b25a 60%,#5e4516);box-shadow:0 0 20px #d9b25a55;opacity:.8;animation-delay:-6s}
#p5{right:26%;top:48%;width:100px;height:100px;opacity:.7;animation-delay:-2s}
#p5 .b{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 30%,#b9ffd8,#3fae86 55%,#0d4a3a);box-shadow:0 0 30px #3fae8655}
#p5 .r{position:absolute;left:-40%;right:-40%;top:38%;height:24%;border:3px solid #d8fff0aa;border-radius:50%;transform:rotate(-18deg)}
#title{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);left:0;right:0;text-align:center;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:#9fb0ff;opacity:.85;pointer-events:none}
#hint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);left:0;right:0;text-align:center;font-size:15px;color:var(--gold);animation:pulse 2s infinite;pointer-events:none}
@keyframes pulse{50%{opacity:.35}}
#rocket{position:fixed;left:0;top:0;width:150px;height:90px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5;will-change:transform;touch-action:manipulation}
#rocket svg{width:130px;height:auto;filter:drop-shadow(0 0 12px #8fb4ff88)}
.flame{transform-origin:right center;animation:fl .12s infinite alternate}
@keyframes fl{from{transform:scaleX(.7)}to{transform:scaleX(1.25)}}
#card{position:fixed;left:50%;top:50%;width:min(88vw,460px);transform:translate(-50%,-50%) scale(.85);opacity:0;pointer-events:none;transition:.5s;z-index:10;padding:26px 22px 20px;border-radius:22px;background:linear-gradient(160deg,#1a1f5acc,#2a1050cc);border:1px solid #8fa4ff66;box-shadow:0 0 50px #6d7dff55,inset 0 0 30px #ffffff10;backdrop-filter:blur(6px);text-align:center}
#card.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
#msg{font-size:clamp(17px,4.6vw,21px);line-height:1.6;min-height:9em;text-shadow:0 0 10px #a9b8ff88}
#msg::after{content:'✦';color:var(--gold);margin-left:4px;animation:pulse 1s infinite}
#close{margin-top:14px;padding:10px 22px;border:0;border-radius:999px;background:linear-gradient(90deg,#ffd98a,#ff9ec4);color:#2a1050;font-weight:700;font-size:15px;cursor:pointer}
#snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:20;width:42px;height:42px;border-radius:50%;border:1px solid #8fa4ff66;background:#10153acc;color:#fff;font-size:18px;cursor:pointer}
#start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at center,#14186bee,#03040df5);text-align:center;padding:24px}
#start h1{margin:0;font-size:clamp(26px,7vw,40px)}
#start p{margin:0;color:#b6c2ff}
#start button{padding:14px 34px;border:0;border-radius:999px;font-size:17px;font-weight:700;background:linear-gradient(90deg,#ffd98a,#ff9ec4);color:#2a1050;cursor:pointer;box-shadow:0 0 30px #ffb7d580}
</style>
</head>
<body>
<div id="planet"></div><div class="pl" id="p2"></div><div class="pl" id="p3"></div><div class="pl" id="p4"></div><div class="pl" id="p5"><div class="b"></div><div class="r"></div></div>
<canvas id="c"></canvas>
<div id="title">✦ Antariksa Buatan ✦</div>
<button id="snd" aria-label="Suara">🔊</button>
<div id="rocket" role="button" aria-label="Roket">
<svg viewBox="0 0 160 70">
<g class="flame"><path d="M40 35 L2 22 Q14 35 2 48Z" fill="#ff9d3c"/><path d="M40 35 L16 28 Q24 35 16 42Z" fill="#fff3a0"/></g>
<path d="M40 22 H95 Q135 22 152 35 Q135 48 95 48 H40Z" fill="#f2f5ff"/>
<path d="M95 22 Q135 22 152 35 Q135 48 95 48Z" fill="#ff5d7a"/>
<path d="M40 22 L22 6 H56 L66 22Z M40 48 L22 64 H56 L66 48Z" fill="#6d7dff"/>
<circle cx="86" cy="35" r="8" fill="#8fe3ff" stroke="#3a4ab8" stroke-width="3"/>
<rect x="38" y="30" width="6" height="10" fill="#c9d2ff"/>
</svg>
</div>
<div id="hint">✨ Sentuh roketnya! ✨</div>
<div id="card"><div id="msg"></div><button id="close">Makasih 💫</button></div>
<div id="start"><h1>🚀 Selamat datang di Antariksa</h1><p>Nyalakan suara untuk pengalaman terbaik</p><button id="go">Mulai Jelajah</button></div>

<script>
const MESSAGE="Gimana kuis nya?? Bisa ngerjain nya kan? Pasti capek ya belajar untuk kuis hari ini. Gak papa, besok ada hari libur, jadi kamu bisa istirahat besok";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,dpr=Math.min(window.devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

const stars=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.5+.3,p:Math.random()*6,s:Math.random()*2+.5}));
let parts=[];
const COLORS=[45,200,320,260,170];
function dust(x,y,n,power,fromCard){
  for(let i=0;i<n&&parts.length<150;i++){
    const a=Math.random()*Math.PI*2,v=Math.random()*power;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(fromCard?0:10),life:1,decay:.6+Math.random()*.7,r:Math.random()*2.6+.8,h:COLORS[Math.random()*COLORS.length|0]});
  }
}

const rocket=document.getElementById('rocket'),card=document.getElementById('card'),msgEl=document.getElementById('msg');
let rx=-200,ry=H*.3,speed=130,baseY=H*.3,t0=0,active=true,typing=null,last=performance.now();
function respawn(){rx=-180;baseY=H*(.18+Math.random()*.45);active=true;rocket.style.display='flex'}
function frame(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  ctx.clearRect(0,0,W,H);
  for(const s of stars){const a=.5+.5*Math.sin(now/1000*s.s+s.p);ctx.fillStyle=`rgba(255,255,255,${.25+a*.75})`;ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,6.3);ctx.fill()}
  if(active){
    rx+=speed*dt;ry=baseY+Math.sin(rx/70)*18;
    if(rx>W+180)respawn();
    const ang=Math.cos(rx/70)*4;
    rocket.style.transform=`translate(${rx-75}px,${ry-45}px) rotate(${ang}deg)`;
    if(Math.random()<.12&&parts.length<120)parts.push({x:rx-60,y:ry+(Math.random()-.5)*8,vx:-40-Math.random()*40,vy:(Math.random()-.5)*20,life:.6,decay:1.8,r:Math.random()*1.5+.6,h:30});
  }
  ctx.globalCompositeOperation='lighter';
  for(const p of parts){
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;p.vy=p.vy*.985+6*dt;p.life-=p.decay*dt;
    if(p.life<=0)continue;
    const tw=.6+.4*Math.sin(now/60+p.x);
    ctx.fillStyle=`hsla(${p.h},100%,75%,${Math.max(p.life,0)*tw})`;
    
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.3);ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
  parts=parts.filter(p=>p.life>0);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function showMessage(){
  card.classList.add('show');msgEl.textContent='';
  let i=0;clearInterval(typing);
  typing=setInterval(()=>{
    msgEl.textContent=MESSAGE.slice(0,++i);
    const r=card.getBoundingClientRect();
    if(i%3===0)dust(r.left+Math.random()*r.width,r.top+Math.random()*r.height*.8,1,40,true);
    if(i%6===0)chime();
    if(i>=MESSAGE.length)clearInterval(typing);
  },55);
}
function pop(e){
  if(!active)return;e.preventDefault();
  active=false;rocket.style.display='none';
  document.getElementById('hint').style.display='none';
  dust(rx,ry,60,300);
  setTimeout(()=>dust(rx,ry,25,160),180);
  boom();showMessage();
}
rocket.addEventListener('pointerdown',pop);
document.getElementById('close').addEventListener('click',()=>{
  card.classList.remove('show');clearInterval(typing);
  setTimeout(respawn,700);
});

/* ===== Backsound antariksa (disintesis lewat WebAudio) ===== */
let ac,master,muted=false,started=false;
function chime(){
  if(!ac||muted)return;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type='sine';o.frequency.value=[784,988,1175,1568][Math.random()*4|0];
  g.gain.setValueAtTime(0,ac.currentTime);g.gain.linearRampToValueAtTime(.08,ac.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+1.6);
  o.connect(g).connect(master);o.start();o.stop(ac.currentTime+1.7);
}
function boom(){
  if(!ac||muted)return;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type='triangle';o.frequency.setValueAtTime(220,ac.currentTime);o.frequency.exponentialRampToValueAtTime(40,ac.currentTime+.8);
  g.gain.setValueAtTime(.25,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.9);
  o.connect(g).connect(master);o.start();o.stop(ac.currentTime+1);
}
function startAudio(){
  if(started)return;started=true;
  ac=new (window.AudioContext||window.webkitAudioContext)();
  master=ac.createGain();master.gain.value=.35;
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;
  const delay=ac.createDelay(2);delay.delayTime.value=.55;
  const fb=ac.createGain();fb.gain.value=.45;delay.connect(fb).connect(delay);
  lp.connect(master);lp.connect(delay);delay.connect(master);master.connect(ac.destination);
  const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.08;lg.gain.value=350;lfo.connect(lg).connect(lp.frequency);lfo.start();
  [[55,0],[110,4],[164.8,-3],[220,5],[277.2,-4],[329.6,3]].forEach(([f,d],i)=>{
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=i<2?'sawtooth':'sine';o.frequency.value=f;o.detune.value=d;g.gain.value=i<2?.07:.05;
    const l=ac.createOscillator(),lgn=ac.createGain();l.frequency.value=.05+i*.03;lgn.gain.value=.03;l.connect(lgn).connect(g.gain);l.start();
    o.connect(g).connect(lp);o.start();
  });
  (function twinkle(){
    if(!muted){
      const o=ac.createOscillator(),g=ac.createGain(),n=[523,659,784,1047,1319][Math.random()*5|0];
      o.type='sine';o.frequency.value=n;
      g.gain.setValueAtTime(0,ac.currentTime);g.gain.linearRampToValueAtTime(.05,ac.currentTime+.05);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+2.5);
      o.connect(g);g.connect(master);g.connect(delay);o.start();o.stop(ac.currentTime+2.6);
    }
    setTimeout(twinkle,1500+Math.random()*3000);
  })();
}
document.getElementById('go').addEventListener('click',()=>{
  document.getElementById('start').style.display='none';startAudio();if(ac.state==='suspended')ac.resume();
});
document.getElementById('snd').addEventListener('click',e=>{
  muted=!muted;e.target.textContent=muted?'🔇':'🔊';
  if(master)master.gain.value=muted?0:.35;
});
document.addEventListener('visibilitychange',()=>{if(ac)document.hidden?ac.suspend():ac.resume()});
</script>
</body>
</html>
